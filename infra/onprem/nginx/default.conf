# Reference nginx for the on-prem stack: SPA + /api/v1 proxy + public PDFs from MinIO, TLS (self-signed).
# Plain-HTTP requests on the TLS port get a redirect hint from nginx itself (497).
map $request_uri $pdf_key_ok {
    default 0;
    ~^/pdfs/[^?]+[^/?]$ 1;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 55m;   # template packages / bulk imports (API enforces its own limits)

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /usr/share/nginx/html;

    # API: never cached.
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # /internal/** (health, task endpoints) is never exposed: it falls through to the SPA like on Firebase Hosting.

    # Public PDFs: GET/HEAD only, objects only (no bucket listing, no trailing-slash/query listing), no-cache.
    location /pdfs/ {
        limit_except GET HEAD { deny all; }
        if ($pdf_key_ok = 0) { return 404; }
        if ($args != "") { return 404; }
        proxy_pass http://minio:9000/cm-pdfs/;
        proxy_set_header Host minio:9000;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Server;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Hashed assets: immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA: every other path (deep links such as /c/<id>) serves index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
