# Declarative twin of infra/deploy-api.sh (Knative serving v1). ${VARS} are substituted by
# `envsubst` (see deploy-api.sh --yaml). Keep both files in sync; infra/test-dry-run.sh checks the limits.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: certificates-api
  labels:
    cloud.googleapis.com/location: us-east1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/cpu-throttling: 'true' # CPU only during requests
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: certificates-api-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - { name: NODE_ENV, value: production }
            - { name: LOG_LEVEL, value: '${LOG_LEVEL}' }
            - { name: GCP_PROJECT, value: '${PROJECT_ID}' }
            - { name: SERVICE_URL, value: '${SERVICE_URL}' }
            - { name: PUBLIC_BASE_URL, value: '${PUBLIC_BASE_URL}' }
            - {
                name: PDF_PUBLIC_BASE_URL,
                value: 'https://storage.googleapis.com/${PROJECT_ID}-pdfs',
              }
            - { name: TEMPLATES_BUCKET, value: '${PROJECT_ID}-templates' }
            - { name: PDF_BUCKET, value: '${PROJECT_ID}-pdfs' }
            - { name: TASKS_QUEUE, value: email-queue }
            - { name: TASKS_LOCATION, value: us-east1 }
            - {
                name: TASKS_INVOKER_SA,
                value: 'tasks-invoker@${PROJECT_ID}.iam.gserviceaccount.com',
              }
            - { name: BOOTSTRAP_ADMIN_EMAIL, value: '${BOOTSTRAP_ADMIN_EMAIL}' }
            - { name: EMAIL_PROVIDER, value: '${EMAIL_PROVIDER}' }
            - { name: EMAIL_FROM_ADDRESS, value: '${EMAIL_FROM_ADDRESS}' }
            - { name: EMAIL_FROM_NAME, value: '${EMAIL_FROM_NAME}' }
            - { name: DB_ADAPTER, value: firestore }
            - { name: STORAGE_ADAPTER, value: gcs }
            - { name: QUEUE_ADAPTER, value: cloud-tasks }
            - { name: AUTH_PROVIDER, value: firebase }
            - name: EMAIL_API_KEY
              valueFrom:
                secretKeyRef: { name: EMAIL_API_KEY, key: latest }
          startupProbe:
            httpGet: { path: /internal/healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /internal/healthz, port: 8080 }
            periodSeconds: 30
