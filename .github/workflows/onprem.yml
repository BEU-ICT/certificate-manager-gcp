name: onprem

# The on-prem profile (docker-compose.onprem.yml: PostgreSQL, MinIO, Redis, SMTP, Keycloak) is tested
# continuously, but not on every pull request (cost/time): merges to `dev`, nightly, by hand, and on
# pull requests that carry the `onprem` label. Not a required check for PRs; a red run on `dev` blocks
# release tags. BEU-ICT/certificate-manager#441.
on:
  push:
    branches: [dev]
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: onprem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE: docker compose -f docker-compose.onprem.yml -f infra/onprem/docker-compose.ci.yml --env-file .env.onprem

jobs:
  # One matrix leg per adapter: the summary shows which adapters pass. Each leg starts only the service it needs.
  adapters:
    name: adapter ${{ matrix.adapter }}
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'onprem') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: postgres
            service: postgres
          - adapter: s3
            service: minio
          - adapter: redis
            service: redis
          - adapter: smtp
            service: mailpit
          - adapter: oidc
            service: keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create .env.onprem (random secrets)
        run: ./scripts/onprem-init-env.sh
      - name: Start ${{ matrix.service }}
        run: ${COMPOSE} up -d --wait ${{ matrix.service }}
      - name: Contract suite (${{ matrix.adapter }})
        working-directory: api
        run: |
          set -euo pipefail
          set -a; . ../.env.onprem; set +a
          case "${{ matrix.adapter }}" in
            postgres)
              POSTGRES_TEST_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB}" \
                npm run test:postgres ;;
            s3)
              S3_TEST_ENDPOINT="http://localhost:${MINIO_PORT:-9000}" \
              S3_TEST_ACCESS_KEY="${MINIO_ROOT_USER}" S3_TEST_SECRET_KEY="${MINIO_ROOT_PASSWORD}" \
                npx vitest run --config vitest.integration.config.ts test/integration/s3-storage.integration.test.ts ;;
            redis)
              REDIS_URL="redis://:${REDIS_PASSWORD}@localhost:6379" \
                npx vitest run --config vitest.integration.config.ts test/integration/redis.integration.test.ts ;;
            smtp)
              npx vitest run test/unit/smtp-email-sender.test.ts
              curl -fsS "http://localhost:${MAILPIT_UI_PORT:-8025}/api/v1/info" >/dev/null ;;
            oidc)
              npx vitest run test/unit/oidc-token-verifier.test.ts
              curl -fsS "http://localhost:${KEYCLOAK_PORT:-8180}/realms/certificate-manager/.well-known/openid-configuration" \
                | grep -q '"jwks_uri"' ;;
          esac
      - name: Compose logs
        if: failure()
        run: ${COMPOSE} logs --no-color --tail 200

  # The whole stack (built images) and the Playwright smoke suite against nginx.
  smoke:
    name: stack + playwright smoke
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'onprem') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Create .env.onprem (random secrets)
        run: ./scripts/onprem-init-env.sh
      - name: Start the stack
        run: ${COMPOSE} up --build -d --wait
      - run: npx playwright test --config playwright.onprem.config.ts
        working-directory: web
      - name: Compose logs
        if: failure()
        run: ${COMPOSE} logs --no-color --tail 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-onprem
          path: web/playwright-report/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: ${COMPOSE} down -v
