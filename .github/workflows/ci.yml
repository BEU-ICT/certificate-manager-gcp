name: ci

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Workspace scripts run with `--workspaces --if-present`, so a workspace that does not
# define a script yet (for example `web/` before its scaffold) is skipped, not failed.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run i18n:check --workspaces --if-present
      - run: npx prettier --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  depcruise:
    name: depcruise
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run depcruise --workspaces --if-present

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit --workspaces --if-present
      - run: npm run test:architecture --workspaces --if-present

  # Firebase emulators (Firestore, Auth) are started once by `firebase emulators:exec`; the
  # Vitest run inside it reuses them. Storage emulator tests are env-gated and skipped here.
  test-integration:
    name: test:integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Emulator jars live in ~/.cache/firebase; the key follows the firebase-tools version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:integration -w api

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only, never pushed (deploys are manual, no cloud credentials in CI).
      - run: docker build --pull --tag certificate-manager-api:ci api

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  # Secret scan with the gitleaks CLI (checksum-verified release binary). The gitleaks
  # GitHub Action is avoided because it needs a license key for organisation repos.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan full history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose .'

  # Breaking API changes (removed or renamed path/field, narrowed type, new required request
  # field) fail the job unless the PR carries the `breaking-api-v2` label. Runs on pull requests
  # only. The label is read live, so labelling the PR and re-running the job is enough.
  # Locally: see "OpenAPI" in api/README.md.
  openapi-check:
    name: openapi-check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      OASDIFF_VERSION: 1.35.0
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff
        run: |
          set -euo pipefail
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" oasdiff
      - name: Read breaking-api-v2 label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if printf '%s\n' "${labels}" | grep -qx 'breaking-api-v2'; then
            echo "allow=true" >> "${GITHUB_OUTPUT}"
          else
            echo "allow=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Diff api/openapi.json against the base branch
        env:
          OASDIFF: ${{ runner.temp }}/oasdiff
          ALLOW_BREAKING: ${{ steps.label.outputs.allow }}
          BASE_REF: ${{ github.base_ref }}
        run: api/scripts/openapi-check.sh "origin/${BASE_REF}"

  # Aggregating job: this is the check to mark as required (see docs/README.md).
  ci:
    name: ci
    if: ${{ always() }}
    needs:
      [
        lint,
        typecheck,
        depcruise,
        test-unit,
        test-integration,
        build,
        docker-build,
        audit,
        gitleaks,
        openapi-check,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for r in ${RESULTS}; do
            # openapi-check only runs on pull requests, so "skipped" is fine for it.
            if [ "${r}" != "success" ] && [ "${r}" != "skipped" ]; then
              echo "::error::At least one required job did not succeed."
              exit 1
            fi
          done
